<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0b1224;
    --bg-2:#122042;
    --bg-3:#0e2b3a;
    --card:rgba(255,255,255,0.055);
    --card-border:rgba(255,255,255,0.10);
    --card-hover:rgba(255,255,255,0.09);
    --ink:#eef1f7;
    --ink-dim:#a9b3c9;
    --ink-faint:#6c7690;
    --line:rgba(255,255,255,0.09);

    --gold:#e2b04a;
    --gold-dim:rgba(226,176,74,0.14);
    --afblue:#4f8fe8;
    --afblue-dim:rgba(79,143,232,0.14);
    --atlas:#38c9b9;
    --atlas-dim:rgba(56,201,185,0.14);
    --flag-alert:#e0645a;
    --sfo:#b48cf2;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{-webkit-text-size-adjust:100%;}

  body{
    min-height:100vh;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 700px at 12% -10%, rgba(79,143,232,0.18), transparent 60%),
      radial-gradient(ellipse 800px 600px at 110% 10%, rgba(56,201,185,0.14), transparent 55%),
      radial-gradient(ellipse 1000px 800px at 50% 120%, rgba(226,176,74,0.08), transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment:fixed;
    padding:24px 24px 80px;
  }

  .wrap{max-width:1160px; margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:20px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }

  .month-label{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-size:clamp(2.4rem, 5vw, 3.4rem);
    letter-spacing:-0.01em;
    line-height:1;
    color:var(--gold);
  }

  .month-sub{
    color:var(--ink-dim);
    font-size:0.95rem;
    margin-top:10px;
  }

  .search-box{
    flex:1 1 320px;
    max-width:520px;
    margin-left:auto;
    position:relative;
  }

  .search-box svg{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    color:var(--atlas);
    pointer-events:none;
  }

  .search-box input{
    width:100%;
    background:rgba(255,255,255,0.10);
    border:2px solid var(--atlas);
    border-radius:999px;
    padding:15px 22px 15px 50px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:1.1rem;
    font-weight:500;
    outline:none;
    box-shadow:0 0 0 4px rgba(56,201,185,0.12), 0 6px 24px rgba(0,0,0,0.25);
    transition:border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .search-box input::placeholder{
    color:var(--ink-dim);
    font-weight:400;
  }

  .search-box input:focus{
    background:rgba(255,255,255,0.16);
    border-color:var(--gold);
    box-shadow:0 0 0 5px rgba(226,176,74,0.22), 0 6px 24px rgba(0,0,0,0.3);
  }


  .daily-card{
    display:flex;
    flex-wrap:wrap;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    margin-bottom:16px;
    overflow:hidden;
  }

  .daily-seg{
    flex:1 1 150px;
    min-width:150px;
    padding:12px 16px;
    border-left:1px solid var(--line);
  }

  .daily-seg:first-child{border-left:none;}

  .daily-label{
    font-size:0.72rem;
    color:var(--ink-faint);
    margin-bottom:6px;
  }

  .daily-value{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:8px;
    font-variant-numeric:tabular-nums;
  }

  .daily-value + .daily-value{
    margin-top:8px;
  }

  .weather-icon{
    display:flex;
    flex:0 0 auto;
  }

  .weather-icon svg{
    width:19px;
    height:19px;
    color:var(--atlas);
  }

  @media (max-width:600px){
    .daily-card{flex-direction:column;}
    .daily-seg{border-left:none; border-top:1px solid var(--line);}
    .daily-seg:first-child{border-top:none;}
  }

  .news-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:16px;
  }

  .news-card{
    flex:2 1 380px;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:14px 16px;
  }

  .sky-card, .flag-card{
    flex:1 1 180px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    justify-content:center;
  }

  .sky-card .daily-label, .flag-card .daily-label{
    margin-bottom:2px;
  }

  .news-seg{
    flex:2 1 280px;
    min-width:220px;
  }

  .news-topic-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:2px;
  }

  .news-topics{
    display:flex;
    gap:4px;
  }

  .news-topic-btn{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--ink-faint);
    font-family:'Inter', sans-serif;
    font-size:0.68rem;
    font-weight:500;
    padding:3px 9px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .news-topic-btn:hover{
    color:var(--ink);
    border-color:var(--atlas);
  }

  .news-topic-btn.active{
    background:var(--atlas-dim);
    border-color:var(--atlas);
    color:var(--ink);
  }

  .news-headline{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.05rem;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .news-sub{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:0.95rem;
    color:var(--ink-dim);
    line-height:1.35;
    margin-top:6px;
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.88rem;
    color:var(--ink-dim);
  }

  .moon-icon svg{
    width:28px;
    height:28px;
    flex:0 0 auto;
  }

  .flag-icon{
    font-size:1.1rem;
  }

  .status-faint{
    font-size:0.76rem;
    color:var(--ink-faint);
  }

  .categories{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(270px, 1fr));
    gap:12px;
  }

  .category-cards{
    display:contents;
  }

  .category{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:14px 16px 12px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    display:flex;
    flex-direction:column;
    transition:background 0.25s ease, border-color 0.25s ease;
  }

  .category:hover{
    background:var(--card-hover);
  }

  .cat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }

  .cat-title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.32rem;
    letter-spacing:-0.005em;
  }

  .cat-count{
    font-size:0.8rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }

  .cat-bar{
    height:3px;
    border-radius:2px;
    background:var(--line);
    overflow:hidden;
    margin-bottom:20px;
  }

  .cat-bar-fill{
    height:100%;
    width:0%;
    border-radius:2px;
    transition:width 0.35s ease;
  }

  .category[data-cat="creditcard"] .cat-bar-fill{background:var(--gold);}
  .category[data-cat="afres"] .cat-bar-fill{background:var(--afblue);}
  .category[data-cat="atlas"] .cat-bar-fill{background:var(--atlas);}

  .stats-row{
    display:flex;
    gap:14px;
    margin-bottom:10px;
  }

  .stat{
    flex:1;
    min-width:0;
  }

  .stat-label{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:0.72rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }

  .stat-track{
    height:5px;
    border-radius:3px;
    background:var(--line);
    overflow:hidden;
  }

  .stat-fill{
    height:100%;
    border-radius:3px;
    transition:width 0.35s ease;
  }

  .category[data-cat="creditcard"] .stat-fill{background:var(--gold);}
  .category[data-cat="afres"] .stat-fill{background:var(--afblue);}
  .category[data-cat="atlas"] .stat-fill{background:var(--atlas);}

  .stat-overdue .stat-fill, .stat-alert .stat-fill{background:var(--flag-alert) !important;}
  .stat-overdue .stat-sub, .stat-alert .stat-sub{color:var(--flag-alert);}

  .stat-sub{
    font-size:0.72rem;
    color:var(--ink-faint);
    margin-top:5px;
  }

  ul.items{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .cat-note{
    width:100%;
    margin-top:16px;
    padding-top:12px;
    border:none;
    border-top:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    line-height:1.5;
    resize:vertical;
    min-height:20px;
  }

  .cat-note::placeholder{
    color:var(--ink-faint);
  }

  .item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:6px 4px;
    border-radius:10px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .item:hover{
    background:rgba(255,255,255,0.035);
  }

  .checkbox{
    flex:0 0 20px;
    width:20px;
    height:20px;
    margin-top:1px;
    border-radius:6px;
    border:1.5px solid var(--ink-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color 0.2s ease, background 0.2s ease;
  }

  .category[data-cat="creditcard"] .item.checked .checkbox{background:var(--gold); border-color:var(--gold);}
  .category[data-cat="afres"] .item.checked .checkbox{background:var(--afblue); border-color:var(--afblue);}
  .category[data-cat="atlas"] .item.checked .checkbox{background:var(--atlas); border-color:var(--atlas);}
  .category[data-cat="sfobah"] .item.checked .checkbox{background:var(--sfo); border-color:var(--sfo);}

  .checkbox svg{
    width:12px;
    height:12px;
    opacity:0;
    transform:scale(0.6);
    transition:opacity 0.15s ease, transform 0.15s ease;
  }

  .item.checked .checkbox svg{opacity:1; transform:scale(1);}

  .item-text{
    font-size:0.95rem;
    line-height:1.4;
    color:var(--ink);
    transition:color 0.2s ease;
  }

  .item.checked .item-text{
    color:var(--ink-faint);
    text-decoration:line-through;
    text-decoration-color:var(--ink-faint);
    text-decoration-thickness:1px;
  }

  .item-note{
    display:block;
    font-size:0.78rem;
    color:var(--ink-faint);
    margin-top:2px;
  }

  footer{
    margin-top:48px;
    text-align:center;
    color:var(--ink-faint);
    font-size:0.82rem;
    line-height:1.6;
  }

  footer button{
    background:none;
    border:none;
    color:var(--ink-dim);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    font-size:0.82rem;
    font-family:inherit;
    padding:0;
  }

  footer button:hover{color:var(--ink);}

  .save-status{
    margin-top:10px;
    font-size:0.72rem;
    color:var(--ink-faint);
  }

  @media (max-width:600px){
    body{padding:16px 16px 60px;}
    header{align-items:flex-start;}
  }

  :focus-visible{
    outline:2px solid var(--afblue);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="month-label" id="monthLabel">September</div>
      <div class="month-sub" id="monthSub">2026 · resets in — days</div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input type="text" id="googleSearch" placeholder="Search Google — press Enter" autocomplete="off">
    </div>
  </header>

  <div class="daily-card">
    <div class="daily-seg">
      <div class="daily-label" id="myLocationLabel">Your location</div>
      <div class="daily-value" id="myDate">—</div>
      <div class="daily-value" id="myTime">—</div>
      <div class="daily-value">
        <span class="weather-icon" id="myWeatherIcon"></span>
        <span id="myWeatherText">Locating…</span>
      </div>
    </div>
    <div class="daily-seg">
      <div class="daily-label">Back home · South Lake Tahoe</div>
      <div class="daily-value" id="dailyDate">—</div>
      <div class="daily-value" id="dailyTime">—</div>
      <div class="daily-value">
        <span class="weather-icon" id="weatherIcon"></span>
        <span id="weatherText">—</span>
      </div>
    </div>
  </div>

  <div class="news-row">
    <div class="news-card">
      <div class="news-seg">
        <div class="news-topic-row">
          <div class="daily-label" id="newsLabel">South Lake Tahoe news</div>
          <div class="news-topics" id="newsTopics">
            <button type="button" class="news-topic-btn active" data-topic="tahoe">Tahoe</button>
            <button type="button" class="news-topic-btn" data-topic="world">World</button>
            <button type="button" class="news-topic-btn" data-topic="c5">C-5</button>
            <button type="button" class="news-topic-btn" data-topic="space">Space</button>
          </div>
        </div>
        <div class="news-headline" id="newsHeadline">Loading…</div>
        <div class="news-sub" id="newsSub"></div>
      </div>
    </div>

    <div class="flag-card">
      <div class="daily-label">Flag</div>
      <div class="status-row">
        <span class="flag-icon" id="flagIcon"></span>
        <span id="flagText">Checking flag status…</span>
      </div>
      <div class="status-row" id="holidayRow" style="display:none;">
        <span id="holidayEmoji"></span>
        <span id="holidayText"></span>
      </div>
    </div>

    <div class="sky-card">
      <div class="daily-label">Sky</div>
      <div class="status-row">
        <span class="moon-icon" id="moonIcon"></span>
        <span id="moonText">—</span>
      </div>
      <div class="status-row">
        <span id="mercuryEmoji">✅</span>
        <span id="mercuryText" class="status-faint">—</span>
      </div>
    </div>
  </div>

  <div class="categories">
    <div class="category-cards" id="categories"></div>
  </div>

  <footer>
    Checks are saved locally. Monthly items clear each new month; quarterly, semiannual, and annual items each clear on their own cycle.
    <br>
    <button id="resetBtn" type="button">Clear this month's checks</button>
    <div id="saveStatus" class="save-status"></div>
  </footer>
</div>

<script>
  const DATA = [
    {
      key: "creditcard",
      title: "Credit Card",
      items: [
        { id: "cc-dunkin", text: "Dunkin' Credit", period: "monthly" },
        { id: "cc-cfa", text: "Chick-fil-A Credit", period: "monthly" },
        { id: "cc-resy", text: "Resy Credit", period: "quarterly" },
        { id: "cc-lululemon", text: "Lululemon Credit", period: "quarterly" },
        { id: "cc-dell", text: "Dell Credit", period: "semiannual" },
        { id: "cc-travelbank", text: "Travel Bank Credit", period: "annual" }
      ]
    },
    {
      key: "afres",
      title: "Air Force Reserves",
      items: [
        { id: "af-tsp-limit", text: "Check LES for TSP limit" },
        { id: "af-gtp-utas", text: "Log GTP / UTAs" },
        { id: "af-va-tracker", text: "Log Monthly Status to VA tracker" },
        { id: "af-dts-vouchers", text: "Finish Pending Travel Vouchers in DTS" },
        { id: "af-arows-orders", text: "Sign/Certify Orders in AROWS" }
      ]
    },
    {
      key: "atlas",
      title: "Atlas Air",
      items: [
        { id: "atlas-concur-receipts", text: "Concur Receipts" },
        { id: "atlas-bids-schedule", text: "Submit Monthly Bids / Schedule" }
      ]
    },
    {
      key: "sfobah",
      title: "SFO BAH",
      items: [
        { id: "sfo-monthly-bill", text: "Monthly Bill" },
        { id: "sfo-venmo-rent", text: "Venmo Rent" },
        { id: "sfo-saved-folder", text: "Saved in folder" }
      ]
    }
  ];

  document.getElementById("googleSearch").addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    const q = e.target.value.trim();
    if(!q) return;
    window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, "_blank", "noopener");
    e.target.value = "";
  });

  function monthKey(d = new Date()){
    return `monthly-reset-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }

  function quarterKey(d = new Date()){
    const q = Math.floor(d.getMonth() / 3) + 1;
    return `quarterly-reset-${d.getFullYear()}-Q${q}`;
  }

  function semiannualKey(d = new Date()){
    const h = d.getMonth() < 6 ? 1 : 2;
    return `semiannual-reset-${d.getFullYear()}-H${h}`;
  }

  function annualKey(d = new Date()){
    return `annual-reset-${d.getFullYear()}`;
  }

  // --- Daily strip: South Lake Tahoe local time + weather ---
  const TAHOE_TZ = "America/Los_Angeles";
  const TAHOE_LAT = 38.9399, TAHOE_LON = -119.9772;

  const WEATHER_ICONS = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>`,
    cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 19a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 17.9 8.02 4.5 4.5 0 0 1 17 19H6.5Z"></path></svg>`,
    fog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 17.4 5.5"></path><line x1="3" y1="18" x2="21" y2="18"></line><line x1="5" y1="21" x2="19" y2="21"></line></svg>`,
    rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 17.9 8.02 4.5 4.5 0 0 1 17 15H6.5Z"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="19" x2="12" y2="21"></line><line x1="16" y1="19" x2="16" y2="21"></line></svg>`,

  // Weather at wherever the browser currently is — useful when traveling.
  function fetchMyWeather(){
    const labelEl = document.getElementById("myLocationLabel");

    const iconEl = document.getElementById("myWeatherIcon");

    if(!navigator.geolocation){
      textEl.textContent = "Location unavailable";

    }

    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude, longitude } = pos.coords;

      try{
        const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&temperature_unit=fahrenheit`;
        const wRes = await fetch(wUrl);

  // --- Federal holiday + flag half-staff (based on Tahoe's calendar date) ---

  function getTahoeDateParts(){
    const fmt = new Intl.DateTimeFormat("en-US", { timeZone: TAHOE_TZ, year: "numeric", month: "2-digit", day: "2-digit" });
    const parts = fmt.formatToParts(new Date());
    const obj = {};
    parts.forEach(p => obj[p.type] = p.value);
    return new Date(Number(obj.year), Number(obj.month) - 1, Number(obj.day));
  }

  function nthWeekdayOfMonth(year, monthIndex, weekday, n){
    const first = new Date(year, monthIndex, 1);
    const day = 1 + ((7 + weekday - first.getDay()) % 7) + (n - 1) * 7;
    return new Date(year, monthIndex, day);
  }

  function lastWeekdayOfMonth(year, monthIndex, weekday){
    const last = new Date(year, monthIndex + 1, 0);
    const day = last.getDate() - ((7 + last.getDay() - weekday) % 7);
    return new Date(year, monthIndex, day);
  }

  function observedDate(d){
    const day = d.getDay();
    if(day === 6) return new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    if(day === 0) return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    return d;
  }

  function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

  function getFederalHoliday(d){
    const y = d.getFullYear();
    const fixed = (m, day) => observedDate(new Date(y, m, day));
    const candidates = [
      { date: fixed(0, 1), name: "New Year's Day", emoji: "🎉" },
      { date: nthWeekdayOfMonth(y, 0, 1, 3), name: "Martin Luther King Jr. Day", emoji: "🕊️" },
      { date: nthWeekdayOfMonth(y, 1, 1, 3), name: "Washington's Birthday", emoji: "🎩" },
      { date: lastWeekdayOfMonth(y, 4, 1), name: "Memorial Day", emoji: "🎖️" },
      { date: fixed(5, 19), name: "Juneteenth", emoji: "⭐" },
      { date: fixed(6, 4), name: "Independence Day", emoji: "🎆" },
      { date: nthWeekdayOfMonth(y, 8, 1, 1), name: "Labor Day", emoji: "🛠️" },
      { date: nthWeekdayOfMonth(y, 9, 1, 2), name: "Columbus Day", emoji: "⛵" },
      { date: fixed(10, 11), name: "Veterans Day", emoji: "🎖️" },
      { date: nthWeekdayOfMonth(y, 10, 4, 4), name: "Thanksgiving Day", emoji: "🦃" },
      { date: fixed(11, 25), name: "Christmas Day", emoji: "🎄" }
    ];
    const todayKey = dateKey(d);
    return candidates.find(c => dateKey(c.date) === todayKey) || null;
  }

  // Fixed, recurring federal half-staff observances. Doesn't capture one-off
  // presidential proclamations (e.g. after a death or tragedy) since those
  // require a live licensed data feed.
  function getFlagStatus(d){
    const y = d.getFullYear();
    const checks = [
      { date: new Date(y, 4, 15), title: "Peace Officers Memorial Day" },
      { date: lastWeekdayOfMonth(y, 4, 1), title: "Memorial Day", note: "until noon local time" },
      { date: new Date(y, 8, 11), title: "Patriot Day" },
      { date: nthWeekdayOfMonth(y, 8, 5, 3), title: "National POW/MIA Recognition Day" },
      { date: nthWeekdayOfMonth(y, 9, 0, 1), title: "National Fallen Firefighters Memorial" },
      { date: new Date(y, 11, 7), title: "Pearl Harbor Remembrance Day" }
    ];
    const todayKey = dateKey(d);
    const match = checks.find(c => dateKey(c.date) === todayKey);
    return match ? { isHalfMast: true, title: match.title, note: match.note || "" } : { isHalfMast: false };
  }

  // --- Moon phase (calculated locally, no API needed) ---
  function getMoonPhase(d){
    const synodicMonth = 29.53058867;
    const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
    const diffDays = (d.getTime() - knownNewMoon) / 86400000;
    const age = ((diffDays % synodicMonth) + synodicMonth) % synodicMonth;
    const frac = age / synodicMonth;

    const phases = [
      { max: 0.033, name: "New Moon" },
      { max: 0.216, name: "Waxing Crescent" },
      { max: 0.284, name: "First Quarter" },
      { max: 0.466, name: "Waxing Gibbous" },
      { max: 0.534, name: "Full Moon" },
      { max: 0.716, name: "Waning Gibbous" },
      { max: 0.784, name: "Last Quarter" },
      { max: 0.966, name: "Waning Crescent" },
      { max: 1.001, name: "New Moon" }
    ];
    const phase = phases.find(p => frac <= p.max);
    return { name: phase.name };
  }

  // Builds a small vector icon for a given named phase. Circle-overlap
  // technique: a lit base disc with a dark "shadow" disc of the same
  // radius laid over it and shifted sideways — how far it's shifted
  // controls how much of the base shows through as a crescent/gibbous.
  // Quarters use a plain straight-edge half-disc instead, since two
  // overlapping same-size circles can't produce a straight terminator.
  function buildMoonSVG(phaseName){
    const LIT = "#f2e6c2";
    const DARK = "#141b30";
    const OUTLINE = "rgba(255,255,255,0.35)";
    const cx = 20, cy = 20, r = 16;
    const outline = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${OUTLINE}" stroke-width="1"/>`;

    function shadowed(shadowCx){
      return `
        <defs><clipPath id="moon-clip"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
        <g clip-path="url(#moon-clip)">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="${LIT}"/>
          <circle cx="${shadowCx}" cy="${cy}" r="${r}" fill="${DARK}"/>
        </g>
        ${outline}`;
    }

    let inner;
    switch(phaseName){
      case "New Moon":
        inner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${DARK}"/>${outline}`;
        break;
      case "Full Moon":
        inner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${LIT}"/>${outline}`;
        break;
      case "First Quarter": // right half lit
        inner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${DARK}"/><path d="M${cx},${cy-r} A${r},${r} 0 0 1 ${cx},${cy+r} Z" fill="${LIT}"/>${outline}`;
        break;
      case "Last Quarter": // left half lit
        inner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${DARK}"/><path d="M${cx},${cy-r} A${r},${r} 0 0 0 ${cx},${cy+r} Z" fill="${LIT}"/>${outline}`;
        break;
      case "Waxing Crescent": // thin lit sliver, right
        inner = shadowed(cx - 6);
        break;
      case "Waxing Gibbous": // thin dark sliver, left
        inner = shadowed(cx - 26);
        break;
      case "Waning Gibbous": // thin dark sliver, right
        inner = shadowed(cx + 26);
        break;
      case "Waning Crescent": // thin lit sliver, left
        inner = shadowed(cx + 6);
        break;
      default:
        inner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${DARK}"/>${outline}`;
    }
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }

  function renderMoon(){
    const moon = getMoonPhase(new Date());
    document.getElementById("moonIcon").innerHTML = buildMoonSVG(moon.name);
    document.getElementById("moonText").textContent = moon.name;

  // --- Mercury retrograde (fixed to the published 2026 station dates) ---
  const MERCURY_RETROGRADE_2026 = [
    { start: "2026-02-26", end: "2026-03-20" },
    { start: "2026-06-29", end: "2026-07-23" },
    { start: "2026-10-24", end: "2026-11-13" }
  ];

  function isMercuryRetrograde(d){
    const key = d.toISOString().slice(0, 10);
    return MERCURY_RETROGRADE_2026.some(r => key >= r.start && key <= r.end);
  }

  function renderMercury(){
    const retro = isMercuryRetrograde(new Date());
    document.getElementById("mercuryEmoji").textContent = retro ? "⚠️" : "✅";
    document.getElementById("mercuryText").textContent = retro
      ? "Mercury is in retrograde"
      : "Mercury is not in retrograde";

  setInterval(renderMercury, 60 * 60 * 1000);

  function daysLeftInMonth(d = new Date()){
    const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return end.getDate() - d.getDate();
  }

  function getQuarterInfo(d){
    const q = Math.floor(d.getMonth()/3) + 1;
    const start = new Date(d.getFullYear(), (q-1)*3, 1);
    const end = new Date(d.getFullYear(), q*3, 0);
    const totalDays = Math.round((end-start)/86400000) + 1;
    const elapsedDays = Math.round((d-start)/86400000) + 1;
    const pct = Math.min(100, Math.max(0, elapsedDays/totalDays*100));
    return { q, pct, daysLeft: totalDays - elapsedDays };
  }

  function getMonthInfo(d){
    const totalDays = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const elapsedDays = d.getDate();
    return { pct: elapsedDays/totalDays*100, daysLeft: totalDays - elapsedDays };
  }

  // Progress toward the Air Force fiscal year end (Sep 30), counting from Oct 1.
  function getFYInfo(d){
    const endMonth = 8, endDay = 30; // September, 0-indexed month
    let end = new Date(d.getFullYear(), endMonth, endDay);
    if(d > end){
      end = new Date(d.getFullYear()+1, endMonth, endDay);
    }
    const start = new Date(end.getFullYear()-1, endMonth+1, 1); // Oct 1
    const totalDays = Math.round((end-start)/86400000);
    const elapsedDays = Math.round((d-start)/86400000);
    const pct = Math.min(100, Math.max(0, elapsedDays/totalDays*100));

    let months = (end.getFullYear()-d.getFullYear())*12 + (end.getMonth()-d.getMonth());
    let days = end.getDate() - d.getDate();
    if(days < 0){
      months--;
      days += new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    }
    return { pct, months, days, fyLabel: `FY${String(end.getFullYear()).slice(-2)}` };
  }

  // Personal safety-margin deadline: Aug 31, one month ahead of the real
  // Sep 30 fiscal year close. Tracks the same Oct 1 - Sep 30 cycle as
  // getFYInfo, so once Aug 31 passes it caps at 100% / overdue instead of
  // rolling forward — Sep 30 is still the real hard deadline.
  function getSafetyInfo(d){
    const endMonth = 8, endDay = 30;
    let fyEnd = new Date(d.getFullYear(), endMonth, endDay);
    if(d > fyEnd){
      fyEnd = new Date(d.getFullYear()+1, endMonth, endDay);
    }
    const fyStart = new Date(fyEnd.getFullYear()-1, endMonth+1, 1); // Oct 1
    const target = new Date(fyEnd.getFullYear(), 7, 31); // Aug 31
    const totalDays = Math.round((target-fyStart)/86400000);
    const elapsedDays = Math.round((d-fyStart)/86400000);
    const pct = Math.min(100, Math.max(0, elapsedDays/totalDays*100));
    const daysLeft = Math.round((target-d)/86400000);
    return { pct, daysLeft, overdue: d > target };
  }

  // Countdown to the next occurrence of a given day-of-month (e.g. the 15th).
  // Rolls to next month once that day has passed.
  function getDayCountdown(targetDay, d){
    let target = new Date(d.getFullYear(), d.getMonth(), targetDay);
    if(d > target){
      target = new Date(d.getFullYear(), d.getMonth() + 1, targetDay);
    }
    const start = new Date(target.getFullYear(), target.getMonth() - 1, targetDay);
    const totalDays = Math.round((target - start) / 86400000);
    const elapsedDays = Math.round((d - start) / 86400000);
    const pct = Math.min(100, Math.max(0, elapsedDays / totalDays * 100));
    const daysLeft = Math.round((target - d) / 86400000);
    return { pct, daysLeft };
  }

  function buildStatsHTML(catKey){
    const now = new Date();
    if(catKey === "creditcard"){
      const qi = getQuarterInfo(now);
      const mi = getMonthInfo(now);
      return `
        <div class="stats-row">
          <div class="stat">
            <div class="stat-label"><span>Q${qi.q} ${now.getFullYear()}</span><span>${Math.round(qi.pct)}%</span></div>
            <div class="stat-track"><div class="stat-fill" style="width:${qi.pct}%"></div></div>
            <div class="stat-sub">${qi.daysLeft} day${qi.daysLeft === 1 ? "" : "s"} left in quarter</div>
          </div>
          <div class="stat">
            <div class="stat-label"><span>This month</span><span>${Math.round(mi.pct)}%</span></div>
            <div class="stat-track"><div class="stat-fill" style="width:${mi.pct}%"></div></div>
            <div class="stat-sub">${mi.daysLeft} day${mi.daysLeft === 1 ? "" : "s"} left</div>
          </div>
        </div>`;
    }
    if(catKey === "afres"){
      const fy = getFYInfo(now);
      const monthsPart = fy.months > 0 ? `${fy.months} month${fy.months === 1 ? "" : "s"}, ` : "";
      const urgent = fy.days < 60;
      return `
        <div class="stats-row">
          <div class="stat${urgent ? " stat-alert" : ""}">
            <div class="stat-label"><span>${fy.fyLabel} · through Sep 30</span><span>${Math.round(fy.pct)}%</span></div>
            <div class="stat-track"><div class="stat-fill" style="width:${fy.pct}%"></div></div>
            <div class="stat-sub">${monthsPart}${fy.days} day${fy.days === 1 ? "" : "s"} remaining</div>
          </div>
        </div>`;
    }
    if(catKey === "atlas"){
      const bids = getDayCountdown(15, now);
      return `
        <div class="stats-row">
          <div class="stat">
            <div class="stat-label"><span>Bid Open · 15th</span><span>${Math.round(bids.pct)}%</span></div>
            <div class="stat-track"><div class="stat-fill" style="width:${bids.pct}%"></div></div>
            <div class="stat-sub">${bids.daysLeft} day${bids.daysLeft === 1 ? "" : "s"} until the 15th</div>
          </div>
        </div>`;
    }
    return "";
  }

  function loadState(key){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function saveState(key, state){
    try{
      localStorage.setItem(key, JSON.stringify(state));
    }catch(e){ /* storage unavailable, fail quietly */ }
  }

  const PERIOD_KEY_FNS = {
    monthly: monthKey,
    quarterly: quarterKey,
    semiannual: semiannualKey,
    annual: annualKey
  };

  const PERIOD_LABELS = {
    monthly: "Monthly",
    quarterly: "Quarterly",
    semiannual: "Semiannual",
    annual: "Annual"
  };

  const periodStates = {
    monthly: loadState(monthKey()),
    quarterly: loadState(quarterKey()),
    semiannual: loadState(semiannualKey()),
    annual: loadState(annualKey())
  };

  function periodOf(item){
    return item.period && PERIOD_KEY_FNS[item.period] ? item.period : "monthly";
  }

  function stateFor(item){
    return periodStates[periodOf(item)];
  }

  function saveStateFor(item){
    const period = periodOf(item);
    saveState(PERIOD_KEY_FNS[period](), periodStates[period]);
    markSaved();
  }

  function markSaved(){
    const el = document.getElementById("saveStatus");
    if(el) el.textContent = `Saved · ${new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}`;
  }

  const now = new Date();
  document.getElementById("monthLabel").textContent =
    now.toLocaleString("en-US", { month: "long", day: "numeric" });
  document.getElementById("monthSub").textContent =
    `${now.getFullYear()} · resets in ${daysLeftInMonth(now)} day${daysLeftInMonth(now) === 1 ? "" : "s"}`;

  const catsEl = document.getElementById("categories");
  const NOTES_KEY = "category-notes-v1";
  const categoryNotes = loadState(NOTES_KEY);

  function render(){
    catsEl.innerHTML = "";
    let totalDone = 0, totalAll = 0;

    DATA.forEach(cat => {
      const done = cat.items.filter(i => stateFor(i)[i.id]).length;
      totalDone += done;
      totalAll += cat.items.length;

      const catEl = document.createElement("div");
      catEl.className = "category";
      catEl.dataset.cat = cat.key;

      catEl.innerHTML = `
        <div class="cat-head">
          <div class="cat-title">${cat.title}</div>
        </div>
        ${buildStatsHTML(cat.key)}
        <ul class="items"></ul>
        <textarea class="cat-note" placeholder="Notes…" rows="2"></textarea>
      `;

      const ul = catEl.querySelector(".items");
      cat.items.forEach(item => {
        const itemState = stateFor(item);
        const li = document.createElement("li");
        li.className = "item" + (itemState[item.id] ? " checked" : "");
        li.tabIndex = 0;
        li.setAttribute("role", "checkbox");
        li.setAttribute("aria-checked", itemState[item.id] ? "true" : "false");
        li.innerHTML = `
          <span class="checkbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0b1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span class="item-text">${item.text}${PERIOD_LABELS[periodOf(item)] ? `<span class="item-note">${PERIOD_LABELS[periodOf(item)]}</span>` : ""}${item.note ? `<span class="item-note">${item.note}</span>` : ""}</span>
        `;
        function toggle(){
          itemState[item.id] = !itemState[item.id];
          saveStateFor(item);
          render();
        }
        li.addEventListener("click", toggle);
        li.addEventListener("keydown", e => {
          if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); }
        });
        ul.appendChild(li);
      });

      const noteEl = catEl.querySelector(".cat-note");
      noteEl.value = categoryNotes[cat.key] || "";
      noteEl.addEventListener("input", () => {
        categoryNotes[cat.key] = noteEl.value;
        saveState(NOTES_KEY, categoryNotes);
        markSaved();
      });

      catsEl.appendChild(catEl);
    });
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if(confirm("Clear all checks for this month? (Quarterly/semiannual/annual items are left alone.)")){
      periodStates.monthly = {};
      saveState(monthKey(), periodStates.monthly);
      markSaved();
      render();
    }
  });

  render();

  // Redundant autosave every 10s, as a safety net on top of the instant
  // per-click/per-keystroke saves above.
  function autosaveAll(){
    Object.entries(periodStates).forEach(([period, s]) => {
      saveState(PERIOD_KEY_FNS[period](), s);
    });
    saveState(NOTES_KEY, categoryNotes);
    markSaved();
  }
  setInterval(autosaveAll, 10 * 1000);
</script>

</body>
</html>
